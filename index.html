<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Website</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
      line-height: 1.6;
      color: #333;
    }
    header {
      text-align: center;
      padding-bottom: 2rem;
      border-bottom: 1px solid #ddd;
    }
    h1 {
      margin-bottom: 0.5rem;
    }
    nav a {
      margin: 0 10px;
      color: #0066cc;
      text-decoration: none;
    }
    nav a:hover {
      text-decoration: underline;
    }
    section {
      margin-top: 2rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Hi, I'm Ryan. </p>
    <nav>
      <a href="#about">About</a>
      <a href="#projects">Projects</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <section id="about">
    <h2>About Me</h2>
    <p>I am Ryan.</p>
  </section>

  <section id="projects">
    <h2>Projects</h2>
    <ul>
      <li><strong>Project 1:</strong> A cool project description.</li>
      <li><strong>Project 2:</strong> Another interesting project.</li>
    </ul>
  </section>

  <section id="contact">
  </section>

</body>
</html>
